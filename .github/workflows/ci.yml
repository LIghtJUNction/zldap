name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact commit to validate before publication
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  RUSTDOCFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }} / Rust ${{ matrix.rust }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: ['1.74.0', stable]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Install toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: rustup toolchain install "$TOOLCHAIN" --profile minimal
      - name: Test and document on the declared toolchain
        shell: bash
        env:
          TOOLCHAIN: ${{ matrix.rust }}
        run: |
          cargo +"$TOOLCHAIN" test --locked --all-targets --all-features
          cargo +"$TOOLCHAIN" test --locked --doc --all-features
          cargo +"$TOOLCHAIN" doc --locked --no-deps --all-features

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: cargo +stable fmt --all -- --check
      - run: cargo +stable clippy --locked --all-targets --all-features -- -D warnings

  portable:
    name: Rust ${{ matrix.rust }} / ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        rust: ['1.74.0', stable]
        target: [wasm32-unknown-unknown, thumbv7em-none-eabi, aarch64-unknown-linux-gnu]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - name: Check the core without std or alloc
        env:
          TOOLCHAIN: ${{ matrix.rust }}
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
          cargo +"$TOOLCHAIN" check --locked --lib --no-default-features --target "$TARGET"

  miri:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install nightly --profile minimal --component miri
      - run: cargo +nightly miri setup
      - name: Interpret the core and regression tests
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: cargo +nightly miri test --locked --lib --tests

  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Compare the pinned protocol implementation
        run: cargo +stable test --locked --manifest-path comparison/Cargo.toml

  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.ref || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - run: python -m unittest discover -s scripts -p 'test_*.py'
      - run: python scripts/check_package.py
      - run: cargo +stable package --locked
      - name: Publication preflight without registry credentials
        run: cargo +stable publish --dry-run --locked
