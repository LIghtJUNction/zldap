name: Release

on:
  push:
    branches: [main]
    # Publish only after an explicit release-request marker change.
    paths: [.github/release-request.json]
  workflow_dispatch:
    inputs:
      bump:
        description: Version change (current publishes the version already in Cargo.toml)
        type: choice
        required: true
        default: current
        options: [current, patch, minor, major]
      resume:
        description: Resume an already published version only when its archive checksum is identical
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: zldap-release
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Require the current default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REQUESTED_REF: ${{ github.ref }}
        run: |
          test "$REQUESTED_REF" = "refs/heads/$DEFAULT_BRANCH" || { echo 'Dispatch Release on the default branch.'; exit 1; }
          test -z "$(git status --porcelain)" || { echo 'Checkout is not clean.'; exit 1; }
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse HEAD)" = "$(git rev-parse FETCH_HEAD)" || { echo 'Default branch advanced; dispatch again on its current commit.'; exit 1; }
      - name: Calculate and apply the requested version
        id: version
        env:
          BUMP: ${{ inputs.bump || 'current' }}
        run: python scripts/release.py bump "$BUMP"
      - name: Commit the release version
        id: commit
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Cargo.toml Cargo.lock comparison/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: release v$VERSION"
            git push origin "HEAD:refs/heads/$DEFAULT_BRANCH"
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  validate:
    needs: prepare
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.prepare.outputs.sha }}
    permissions:
      contents: read

  publish:
    needs: [prepare, validate]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      RELEASE_SHA: ${{ needs.prepare.outputs.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: rustup toolchain install stable --profile minimal
      - name: Check that the validated source is still current
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$RELEASE_SHA" || { echo 'Default branch changed during validation; dispatch Release again.'; exit 1; }
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || { echo 'Existing tag points to a different commit; publication is blocked.'; exit 1; }
          fi
      - run: cargo +stable package --locked
      - name: Check version vacancy or verify an explicit recovery
        id: registry
        env:
          RESUME: ${{ inputs.resume || 'false' }}
        run: python scripts/release.py registry --artifact "target/package/zldap-$VERSION.crate" --resume "$RESUME"
      - name: Publish the validated crate
        if: steps.registry.outputs.published != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN" || { echo 'Configure the CARGO_REGISTRY_TOKEN repository secret.'; exit 1; }
          cargo +stable publish --locked
      - name: Verify the published checksum
        run: python scripts/release.py confirm --artifact "target/package/zldap-$VERSION.crate"
      - name: Create or verify the release tag in this run
        run: |
          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            test "$(git rev-list -n 1 "$TAG")" = "$RELEASE_SHA" || { echo 'Existing tag points to a different commit.'; exit 1; }
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git tag -a "$TAG" "$RELEASE_SHA" -m "zldap $VERSION"
            git push origin "refs/tags/$TAG"
          fi
      - name: Create or complete GitHub Release in this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "target/package/zldap-$VERSION.crate" target/package/SHA256SUMS --clobber
          else
            gh release create "$TAG" "target/package/zldap-$VERSION.crate" target/package/SHA256SUMS --verify-tag --title "zldap $VERSION" --generate-notes
          fi
          echo "Published zldap $VERSION from $RELEASE_SHA" >> "$GITHUB_STEP_SUMMARY"
