name: Benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - name: Record host and compiler
        run: |
          mkdir -p benchmark-output
          rustc +stable -Vv > benchmark-output/environment.txt
          lscpu >> benchmark-output/environment.txt
          git rev-parse HEAD >> benchmark-output/environment.txt
      - name: Check semantic equivalence before timing
        run: cargo +stable test --manifest-path comparison/Cargo.toml --locked
      - name: Measure the isolated comparison binary
        run: |
          set -o pipefail
          cargo +stable build --release --manifest-path comparison/Cargo.toml --locked
          /usr/bin/time -v comparison/target/release/zldap-comparison --iterations 20000 --samples 7 2>benchmark-output/process.txt | tee benchmark-output/results.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: benchmark-${{ github.sha }}
          path: benchmark-output/
          if-no-files-found: error
