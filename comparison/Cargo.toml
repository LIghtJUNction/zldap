[package]
name = "zldap-comparison"
version = "0.0.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace]

[features]
count-allocations = []

[dependencies]
zldap = { path = ".." }
ldap3_proto = "=0.9.0"
ldap3_lber = "=0.9.0"
bytes = "=1.10.1"
nom = "=7.1.3"

[profile.release]
lto = "thin"
codegen-units = 1

[[bin]]
name = "zldap-comparison"
path = "src/main.rs"
